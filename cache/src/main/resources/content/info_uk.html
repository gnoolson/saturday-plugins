<div th:fragment="content">

    <div class="pure-g pb-5">
        <div class="pure-u-1-2">
            <a href="/plugin/cache/doc">Документація</a>
        </div>
        <div class="pure-u-1-2 s-align-right">
            <button onclick="location.reload();" class="pure-button">Оновити</button>
        </div>
    </div>

    <div>
        <h3>
            Список наявний ключів
        </h3>

        <table class="pt-2 pure-table s-w100">
            <thead>
            <tr>
                <th>Ключ</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="key : ${keys}">
                <td th:text="${key}">Ключ</td>
            </tr>
            <tr th:if="${keys.isEmpty()}">
                <td colspan="4" class="s-align-center">Пусто</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
