<div th:fragment="content">

    <div class="pure-g pb-5">
        <div class="pure-u-1-2">
            <a href="/plugin/db/doc">Documentation</a>
        </div>
        <div class="pure-u-1-2 s-align-right">
            <button onclick="location.reload();" class="pure-button">Refresh</button>
        </div>
    </div>

    <div>
        <h3>
            Data Sources
        </h3>

        <table class="pt-2 pure-table s-w100">
            <thead>
            <tr>
                <th>Id</th>
                <th>Driver</th>
                <th>Active Con.</th>
                <th>Idle Con.</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="info : ${infoList}">
                <td th:text="${info.id}">Id</td>
                <td th:text="${info.driverClassName}">Driver</td>
                <td th:text="${info.activeConnections}">Active Con.</td>
                <td th:text="${info.idleConnections}">Idle Con.</td>
            </tr>
            <tr th:if="${infoList.isEmpty()}">
                <td colspan="4" class="s-align-center">Nothing to display</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
