<div th:fragment="content">

    <div class="pure-g pb-5">
        <div class="pure-u-1-2">
            <a href="/plugin/event-bus/doc">Documentations</a>
        </div>
        <div class="pure-u-1-2 s-align-right">
            <button onclick="location.reload();" class="pure-button">Refresh</button>
        </div>
    </div>

    <div>
        <h3>
            Події та підписки
        </h3>

        <table class="pt-2 pure-table s-w100">
            <thead>
            <tr>
                <th>Подія</th>
                <th>Сценарії</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="info : ${infoList}">
                <td th:text="${info.eventName}"></td>
                <td>
                    <div th:each="scriptId : ${info.scriptIds}">
                        <a th:href="@{'~/script/' + ${scriptId} + '/edit'}" th:text="${scriptId}"></a>
                    </div>
                </td>
            </tr>
            <tr th:if="${infoList.isEmpty()}">
                <td colspan="2" class="s-align-center">Нічого немає</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
