<div th:fragment="content">

    <div class="pure-g pb-5">
        <div class="pure-u-1-2">
            <a href="/plugin/serial/doc">Документація</a>
        </div>
        <div class="pure-u-1-2 s-align-right">
            <button onclick="location.reload();" class="pure-button">Оновити</button>
        </div>
    </div>

    <div>
        <h3>
            Зареєстровані пристрої
        </h3>

        <table class="pt-2 pure-table s-w100">
            <thead>
            <tr>
                <th>Ідентифікатор</th>
                <th>Порт</th>
                <th>Системний порт</th>
                <th>Підключений</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="info : ${infoList}">
                <td th:text="${info.deviceId}">Device Id</td>
                <td th:text="${info.port}">Port</td>
                <td th:text="${info.systemPortName}">System Port Name</td>
                <td th:text="${info.connected}">Connected</td>
            </tr>
            <tr th:if="${infoList.isEmpty()}">
                <td colspan="4" class="s-align-center">Немає зареєстрованих пристроїв</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
