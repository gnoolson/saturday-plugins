<div th:fragment="content">

    <div class="grid pb-5">
        <div>
            <a href="/plugin/tg/doc" role="button" class="secondary">Документація</a>
        </div>
        <div style="text-align: right;">
            <button onclick="location.reload();">Оновити</button>
        </div>
    </div>

    <div>
        <h3>
            Активні боти
        </h3>

        <table class="pt-2">
            <thead>
            <tr>
                <th>Ідентифікатор</th>
                <th>Користувач</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="info : ${infoList}">
                <td th:text="${info.id}">Id</td>
                <td th:text="${info.username}">Name</td>
            </tr>
            <tr th:if="${infoList.isEmpty()}">
                <td colspan="4" style="text-align: center">Нічого немає</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
