<div th:fragment="content">

    <div class="pb-5 pure-g">
        <div class="pure-u-1-2">
            <a href="/plugin/timer/doc">Документація</a>
        </div>
        <div class="pure-u-1-2 s-align-right">
            <button onclick="location.reload();" class="pure-button">Оновити</button>
        </div>
    </div>

    <div>
        <h3>
            Завдання
        </h3>

        <table class="pt-2 pure-table s-w100">
            <thead>
            <tr>
                <th>Ідентифікатор</th>
                <th>Назва</th>
                <th>Затримка</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="info : ${infoList}">
                <td th:text="${info.id}">Id</td>
                <td th:text="${info.name}">Name</td>
                <td th:text="${info.delay}">Delay</td>
            </tr>
            <tr th:if="${infoList.isEmpty()}">
                <td colspan="4" class="s-align-center">Нічого немає</td>
            </tr>
            </tbody>
        </table>

    </div>

</div>
